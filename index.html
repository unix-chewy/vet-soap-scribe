<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI SOAP Note Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="text-slate-800 font-sans min-h-screen pb-12">

  <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-2 font-bold text-slate-700">
      <span class="text-xl">🩺</span> SOAP Note Generator
    </div>
    <div class="text-sm text-slate-500 space-x-4 hidden md:block">
      <span>Specialties</span><span>Examples</span><span>Guide</span>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-4 py-8 md:py-12">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold text-slate-800 mb-2">AI SOAP Note Generator</h1>
      <p class="text-slate-500 text-lg">Enter your case notes. Get a complete AI-generated SOAP note in seconds.</p>
    </div>

    <div id="inputSection" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8">
      <label class="block font-semibold text-slate-700 mb-2">Case Note</label>
      <textarea id="rawNotes" rows="5" class="w-full p-4 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition resize-y mb-4" placeholder="e.g. 2yo M pug. Halitosis. Tartar buildup bilateral. Gums red. Needs dental cleaning.">2yo M pug. Halitosis. Tartar buildup bilateral. Gums red. Otherwise healthy. Eats well. Vaccines up to date. Needs dental cleaning.</textarea>
      
      <button id="generateBtn" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center">
        Generate SOAP Note
      </button>

      <div id="progressWrap" class="hidden mt-3">
        <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
          <div id="progressBar" class="h-2 bg-teal-600 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <button id="stopBtn" class="hidden w-full mt-2 bg-white border border-slate-300 text-slate-600 font-semibold py-2 rounded-lg hover:bg-slate-50 transition">
        Stop
      </button>

      <div id="status" class="text-center text-sm text-slate-500 mt-3 h-5">Enter a case note, then tap Generate.</div>
      <div id="notice" class="hidden mt-3 p-3 rounded-lg bg-amber-50 border border-amber-200 text-sm text-amber-800"></div>
    </div>

    <div id="outputSection" class="hidden space-y-4">
      <div id="meta" class="hidden text-xs text-slate-500 text-center px-2"></div>

      <div id="card-S" class="hidden bg-teal-50 border border-teal-200 rounded-xl overflow-hidden shadow-sm">
        <div class="bg-teal-100/50 px-4 py-3 border-b border-teal-200 flex items-center gap-3">
          <span class="bg-teal-600 text-white w-6 h-6 flex items-center justify-center rounded font-bold text-sm">S</span>
          <h3 class="font-bold text-teal-900">Subjective</h3>
          <button onclick="copySection('S')" class="ml-auto text-xs text-teal-700 font-semibold hover:underline">Copy</button>
        </div>
        <div class="p-5 bg-white"><ul id="list-S" class="soap-list"></ul></div>
      </div>

      <div id="card-O" class="hidden bg-blue-50 border border-blue-200 rounded-xl overflow-hidden shadow-sm">
        <div class="bg-blue-100/50 px-4 py-3 border-b border-blue-200 flex items-center gap-3">
          <span class="bg-blue-600 text-white w-6 h-6 flex items-center justify-center rounded font-bold text-sm">O</span>
          <h3 class="font-bold text-blue-900">Objective</h3>
          <button onclick="copySection('O')" class="ml-auto text-xs text-blue-700 font-semibold hover:underline">Copy</button>
        </div>
        <div class="p-5 bg-white"><ul id="list-O" class="soap-list"></ul></div>
      </div>

      <div id="card-A" class="hidden bg-purple-50 border border-purple-200 rounded-xl overflow-hidden shadow-sm">
        <div class="bg-purple-100/50 px-4 py-3 border-b border-purple-200 flex items-center gap-3">
          <span class="bg-purple-600 text-white w-6 h-6 flex items-center justify-center rounded font-bold text-sm">A</span>
          <h3 class="font-bold text-purple-900">Assessment</h3>
          <button onclick="copySection('A')" class="ml-auto text-xs text-purple-700 font-semibold hover:underline">Copy</button>
        </div>
        <div class="p-5 bg-white"><ul id="list-A" class="soap-list"></ul></div>
      </div>

      <div id="card-P" class="hidden bg-orange-50 border border-orange-200 rounded-xl overflow-hidden shadow-sm">
        <div class="bg-orange-100/50 px-4 py-3 border-b border-orange-200 flex items-center gap-3">
          <span class="bg-orange-600 text-white w-6 h-6 flex items-center justify-center rounded font-bold text-sm">P</span>
          <h3 class="font-bold text-orange-900">Plan</h3>
          <button onclick="copySection('P')" class="ml-auto text-xs text-orange-700 font-semibold hover:underline">Copy</button>
        </div>
        <div class="p-5 bg-white"><ul id="list-P" class="soap-list"></ul></div>
      </div>

      <div class="mt-8">
        <button id="nextBtn" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-4 rounded-xl shadow-md transition text-lg">Next: Generate Objective</button>
        <div id="finalActions" class="hidden flex gap-3 justify-center mt-4">
          <button onclick="copyAll()" class="bg-slate-600 hover:bg-slate-700 text-white font-semibold py-2 px-6 rounded-lg transition">Copy All</button>
          <button onclick="window.location.reload()" class="bg-white border border-slate-300 text-slate-700 font-semibold py-2 px-6 rounded-lg hover:bg-slate-50 transition">Start Over</button>
        </div>
      </div>

      <div class="flex justify-center gap-2 mt-6">
        <div class="w-2.5 h-2.5 rounded-full bg-slate-300 transition" id="dot-S"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-slate-300 transition" id="dot-O"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-slate-300 transition" id="dot-A"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-slate-300 transition" id="dot-P"></div>
      </div>
      <p class="text-center text-sm text-slate-500 mt-2" id="stepText">1 of 4</p>
    </div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
